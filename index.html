<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sector 69 - Season 1, now streaming in a premium vertical reel experience." />
    <title>Sector 69</title>
    <link rel="preload" href="assets/logo.png" as="image" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="landing-page">
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-one"></span>
      <span class="orb orb-two"></span>
      <span class="orb orb-three"></span>
      <div class="landing-stars"></div>
    </div>

    <main class="hero-shell">
      <section class="hero-card" aria-labelledby="heroTitle">
        <div class="hero-card__art" aria-hidden="true">
          <img src="assets/logo.png" alt="" />
        </div>

        <div class="hero-card__content">
          <div class="hero-topline">
            <span class="streaming-label">Now Streaming</span>
            <span class="views-badge" aria-label="50 thousand plus views">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              50K+ Views
            </span>
          </div>

          <img class="hero-logo" src="assets/logo.png" alt="Sector 69" />
          <p class="hero-kicker">Season 1</p>
          <h1 id="heroTitle">Sector 69</h1>
          <p class="hero-copy">
            Dark. Bold. Unapologetically Malayalam.
          </p>

          <div class="hero-actions" aria-label="Primary actions">
            <a class="hero-button hero-button--primary" href="warning.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7-11-7Z"></path>
              </svg>
              Play Season
            </a>
            <a class="hero-button hero-button--ghost" href="comments.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.4-5.2A8 8 0 1 1 21 12Z"></path>
              </svg>
              Comments
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
